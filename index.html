<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malzeme Kataloğu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        .card-img-top {
            height: 200px;
            object-fit: contain;
        }

        #loadingOverlay {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,.8);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
        }

        #statsBar {
            display: flex;
            gap: 6px;
            padding: 8px 0;
            overflow-x: auto;
            flex-wrap: nowrap;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        #statsBar::-webkit-scrollbar { display: none; }

        .stat-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 500;
            background: #fff;
            border: 1px solid #dee2e6;
            color: #495057;
            cursor: pointer;
            transition: background .15s, border-color .15s;
            user-select: none;
        }

        .stat-chip:hover {
            background: #e9ecef;
        }

        .stat-chip.active {
            background: #0d6efd;
            border-color: #0d6efd;
            color: #fff;
        }

        .stat-chip .chip-count {
            background: rgba(0,0,0,.12);
            border-radius: 10px;
            padding: 0 6px;
            font-size: 0.72rem;
        }

        .stat-chip.active .chip-count {
            background: rgba(255,255,255,.25);
        }
    </style>
</head>
<body class="bg-light">

<div id="loadingOverlay">
    <div class="spinner-border text-primary"></div>
</div>

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        
        <div class="d-flex align-items-center">
            <a href="https://ovarthy-bot.github.io/navigasyon/" 
               class="btn btn-outline-light btn-sm me-2" 
               title="Ana Sayfaya Git">
               🏠
            </a>
            
            <span class="navbar-brand mb-0 h1">✈️ Malzeme Kataloğu</span>
        </div>

        <button class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#addModal">
            + Yeni Malzeme
        </button>
    </div>
</nav>

<div class="container">

<div id="statsBar"></div>

<div class="card p-3 mb-4 shadow-sm">
    <div class="row g-2">
        <div class="col-md-7 col-9">
            <input type="text" id="searchInput" class="form-control"
                   placeholder="Ara: İsim, P/N veya Not">
        </div>

        <div class="col-md-4 col-3">
            <select id="filterAircraft" class="form-select">
                <option value="">Tüm Uçaklar</option>
                <option>Genel</option>
                <option>A320</option>
                <option>A330</option>
                <option>B737</option>
                <option>B787</option>
            </select>
        </div>
    </div>
</div>

    
    <div id="catalogList" class="row row-cols-1 row-cols-md-3 g-4"></div>
</div>

<!-- MODAL -->
<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Malzeme Ekle</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <form id="addForm">

                    <input type="text" id="inpName" class="form-control mb-2" placeholder="Malzeme Adı" required>
                    <input type="text" id="inpPN" class="form-control mb-2" placeholder="P/N" required>

                    <select id="inpCat" class="form-select mb-2">
                <option>KKD Genmat</option>
                <option>Komponent</option>
                <option>Kimyasal</option>
                <option>Placard</option>
                <option>Sarf</option>
                <option>Tool</option>
                <option>Velcro bant</option>
                <option>Vida</option>
                    </select>

                    <select id="inpAircraft" class="form-select mb-2">
                        <option>Genel</option>
                        <option>A320</option>
                        <option>A330</option>
                        <option>B737</option>
                        <option>B787</option>
                    </select>

                    <textarea id="inpNote" class="form-control mb-3" rows="2" placeholder="Not"></textarea>

                    <input type="file" id="fileCamera" accept="image/*" capture="environment" hidden>
                    <input type="file" id="fileGallery" accept="image/*" hidden>
                    <input type="file" id="inpFile" hidden>

                    <button type="button" id="btnCamera" class="btn btn-outline-primary w-100 mb-2">
                        📷 Kamera ile Çek
                    </button>

                    <button type="button" id="btnGallery" class="btn btn-outline-secondary w-100 mb-3">
                        🖼️ Galeriden Seç
                    </button>

                    <button type="submit" class="btn btn-success w-100">
                        Kaydet
                    </button>

                </form>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content bg-transparent border-0">
            <div class="modal-body p-0 text-center">
                <img id="fullImage" src="" class="img-fluid rounded shadow-lg" style="max-height: 90vh;">
                <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal"></button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/compressorjs/1.2.1/compressor.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
